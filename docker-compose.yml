services:
  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_PATH: /app/data/jobs.db
      JWT_SECRET: "${JWT_SECRET:-super-secret-development-key-at-least-32-chars-long}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENABLE_SCHEDULED_JOBS: ${ENABLE_SCHEDULED_JOBS:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SCREENSHOTS_DIR: /app/screenshots
      EXPORT_DIR: /app/exports
    volumes:
      - ./backend/data:/app/data
      - ./backups:/app/backups
      - ./backend/screenshots:/app/screenshots
      - ./backend/exports:/app/exports
    ports:
      - "5000:5000"
    networks:
      - job-automation
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - job-automation
    restart: unless-stopped

networks:
  job-automation:
    driver: bridge
