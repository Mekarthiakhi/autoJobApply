version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: job_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - job-automation

  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      PORT: 5000
      DB_PATH: /app/data/jobs.db
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET is required and must be at least 32 characters}
      CORS_ORIGIN: ${CORS_ORIGIN:?Error: CORS_ORIGIN is required with explicit allowed domains}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENABLE_SCHEDULED_JOBS: ${ENABLE_SCHEDULED_JOBS:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SCREENSHOTS_DIR: /app/screenshots
      EXPORT_DIR: /app/exports
    volumes:
      - ./backend/data:/app/data
      - ./backups:/app/backups
      - ./backend/screenshots:/app/screenshots
      - ./backend/exports:/app/exports
    ports:
      # Restrict direct public access; only loopback interface for reverse proxy
      - "127.0.0.1:5000:5000"
    networks:
      - job-automation
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      # Restrict direct public access; only loopback interface for reverse proxy
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - job-automation
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  job-automation:
    driver: bridge

